# pnpm 10 (used by Cloudflare Workers Builds) reads onlyBuiltDependencies;
# pnpm 12+ reads allowBuilds. Keep both in sync.
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
